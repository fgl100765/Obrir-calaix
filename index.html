<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Obrir calaix</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f4f4f9;
        }

        .btn {
            background-color: #d32f2f;
            color: white;
            padding: 25px 50px;
            border: none;
            font-size: 22px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn:hover {
            background-color: #b71c1c;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .pin-input {
            font-size: 32px;
            text-align: center;
            letter-spacing: 12px;
            width: 220px;
            padding: 12px;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
            font-weight: bold;
        }

        #drawerBtn {
            display: none;
        }
    </style>
</head>

<body>

    <h1>🏪 Caixa Munbyn ITTPP047P</h1>

    <h2>Si us plau, introduïu el vostre codi PIN!</h2>

    <input
        type="password"
        id="pinInput"
        class="pin-input"
        maxlength="4"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        placeholder="••••"
    >

    <br>

    <button
        class="btn"
        id="drawerBtn"
        onclick="impulsSenden()"
    >
        📥 Obrir calaix
    </button>

    <div class="status" id="statusField">
        Si us plau, introduïu el teu codi PIN!
    </div>

    <script>

        // PIN-CODE
        const PIN_CODE = "4350";

        const pinInput = document.getElementById('pinInput');
        const status = document.getElementById('statusField');
        const drawerBtn = document.getElementById('drawerBtn');

        let opening = false;

        // USB-DATEN
        const USB_VENDOR_ID = 0x04b8;
        const USB_PRODUCT_ID = 0x0e20;

        // ESC/POS-IMPULS
        const ESC_POS_COMMAND = new Uint8Array([
            0x1B, 0x70, 0x00, 0x19, 0xFA
        ]);


        // PIN AUTOMATISCH PRÜFEN
        pinInput.addEventListener('input', function() {

            if (opening) return;

            this.value = this.value
                .replace(/[^0-9]/g, '')
                .slice(0, 4);

            if (this.value.length === 4) {

                if (this.value === PIN_CODE) {

                    status.innerHTML =
                        "✅ Codi PIN correcte! El calaix portamonedes s'està obrint...";

                    pinInput.disabled = true;

                    impulsSenden();

                } else {

                    status.innerHTML =
                        "❌ Codi incorrecte! Si us plau, torneu-ho a provar.";

                    pinInput.value = "";

                    pinInput.focus();
                }
            }
        });


        // KASSENSCHUBLADE ÖFFNEN
        async function impulsSenden() {

            if (opening) return;

            opening = true;
            drawerBtn.disabled = true;

            try {

                let port;

                // Bereits freigegebene Geräte suchen
                const pairedPorts =
                    await navigator.serial.getPorts();

                port = pairedPorts.find(p => {

                    const info = p.getInfo();

                    return (
                        info.usbVendorId === USB_VENDOR_ID &&
                        info.usbProductId === USB_PRODUCT_ID
                    );

                });

                // Falls erforderlich, Gerät auswählen
                if (!port) {

                    status.innerHTML =
                        "Si us plau, seleccioneu una impressora...";

                    port = await navigator.serial.requestPort({
                        filters: [{
                            usbVendorId: USB_VENDOR_ID,
                            usbProductId: USB_PRODUCT_ID
                        }]
                    });

                }

                status.innerHTML =
                    "S'està establint la connexió...";

                await port.open({
                    baudRate: 9600
                });

                status.innerHTML =
                    "S'està enviant l'impuls d'obertura...";

                const writer = port.writable.getWriter();

                try {

                    await writer.write(ESC_POS_COMMAND);

                } finally {

                    writer.releaseLock();

                }

                await port.close();

                status.innerHTML =
                    "✅ Calaix obert!";

                status.className = "status";

                // NACH 2 SEKUNDEN AUTOMATISCH ZURÜCKSETZEN
                setTimeout(function() {

                    pinInput.value = "";
                    pinInput.disabled = false;

                    drawerBtn.disabled = false;

                    status.innerHTML =
                        "Si us plau, introduïu el vostre codi PIN!";

                    pinInput.focus();

                    opening = false;

                }, 2000);

            } catch (error) {

                console.error(error);

                status.innerHTML =
                    "❌ Errada: " + error.message;

                status.className = "status";

                // Bei Fehler PIN-Eingabe wieder freigeben
                pinInput.value = "";
                pinInput.disabled = false;

                drawerBtn.disabled = false;

                opening = false;

                pinInput.focus();

            }

        }

        // Beim Start Cursor direkt ins PIN-Feld setzen
        window.addEventListener('load', function() {
            pinInput.focus();
        });

    </script>

</body>
</html>
